# Production overlay. Usage:
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# All environment values come from the shell environment (e.g. GitHub
# Actions secrets/vars or GitLab CI variables) with sensible defaults
# via the ${VAR:-default} syntax. Required values that *must* be
# provided by the CI system have no default and will fail-fast if
# missing — this is intentional. They are documented in
# .env.production.example.
#
# Differences from the dev compose:
#   - No source bind-mounts (image is the source of truth).
#   - Backend runs gunicorn as the unprivileged `app` user (runtime stage).
#   - Frontend served by nginx as the `nginx` user (runtime stage).
#   - One-shot `migrate` service runs migrations + collectstatic.
#   - Postgres + Redis ports are not exposed to the host.
#   - Restart policies on every long-running service.

services:
  db:
    ports: []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baantask}
      POSTGRES_USER: ${POSTGRES_USER:-baantask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    ports: []
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
      additional_contexts:
        infra: ./docker/backend
      args:
        APP_ENV: ${APP_ENV:-prod}
    image: ${BACKEND_IMAGE:-baantask/backend:latest}
    command: >
      gunicorn baantask.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --threads ${GUNICORN_THREADS:-4}
      --timeout ${GUNICORN_TIMEOUT:-30}
      --graceful-timeout 30
      --max-requests ${GUNICORN_MAX_REQUESTS:-1000}
      --max-requests-jitter 100
      --access-logfile - --error-logfile -
    volumes: []
    user: "1001:1001"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      POSTGRES_DB: ${POSTGRES_DB:-baantask}
      POSTGRES_USER: ${POSTGRES_USER:-baantask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      THROTTLE_ANON: ${THROTTLE_ANON:-60/min}
      THROTTLE_EMPLOYER: ${THROTTLE_EMPLOYER:-600/min}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-claude-haiku-4-5-20251001}
      TRANSLATION_CACHE_TTL: ${TRANSLATION_CACHE_TTL:-604800}
      TRANSLATION_TIMEOUT: ${TRANSLATION_TIMEOUT:-10}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
      target: runtime
      additional_contexts:
        infra: ./docker/backend
      args:
        APP_ENV: ${APP_ENV:-prod}
    image: ${BACKEND_IMAGE:-baantask/backend:latest}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    user: "1001:1001"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      POSTGRES_DB: ${POSTGRES_DB:-baantask}
      POSTGRES_USER: ${POSTGRES_USER:-baantask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: runtime
      additional_contexts:
        infra: ./docker/frontend
        nginx: ./docker/nginx
      args:
        APP_ENV: ${APP_ENV:-prod}
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    image: ${FRONTEND_IMAGE:-baantask/frontend:latest}
    command: ["nginx", "-g", "daemon off;"]
    volumes: []
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
