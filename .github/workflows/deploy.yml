name: CI / CD

# Pipeline:
#
#   code-quality (parallel: backend ruff + frontend biome)
#         │
#         ▼
#       test (backend pytest)
#         │
#         ▼
#       build (parallel: backend image + frontend image, push to registry)
#         │
#         ▼
#      deploy (compose up against the target host)
#
# Required GitHub repo configuration:
#
#   Secrets (Settings → Secrets and variables → Actions → Secrets)
#     DJANGO_SECRET_KEY
#     POSTGRES_PASSWORD
#     ANTHROPIC_API_KEY
#     REGISTRY_USERNAME
#     REGISTRY_PASSWORD
#
#   Variables (Settings → Secrets and variables → Actions → Variables)
#     ALLOWED_HOSTS               e.g. api.example.com
#     CORS_ALLOWED_ORIGINS        e.g. https://app.example.com
#     BACKEND_IMAGE               e.g. ghcr.io/acme/task-manager-backend
#     FRONTEND_IMAGE              e.g. ghcr.io/acme/task-manager-frontend
#     REACT_APP_API_URL           e.g. https://api.example.com/api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Code quality — Ruff (backend) + Biome (frontend) in parallel
  # ============================================================
  quality-backend:
    name: "Quality · Backend (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff==0.16.8

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

  quality-frontend:
    name: "Quality · Frontend (Biome)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Biome check (lint + format + assists)
        working-directory: frontend
        run: bun run ci:check

  # ============================================================
  # 2. Test — pytest, blocked by quality
  # ============================================================
  test:
    name: "Test · Backend (pytest)"
    needs: [quality-backend, quality-frontend]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskmanager"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: ci
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -q

  # ============================================================
  # 3. Build — verify multi-stage Docker images, blocked by test
  # ============================================================
  # No deployment target configured: build runs on every push/PR to
  # verify Dockerfiles, pushes to ghcr only on main when registry
  # images are configured (BACKENT_IMAGE / FRONTEND_IMAGE vars).
  build:
    name: "Build · Images"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend (runtime, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          build-args: |
            APP_ENV=prod
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend (runtime, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          build-args: |
            APP_ENV=prod
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ============================================================
  # 4. Deploy — compose against the target host
  # ============================================================
  # Deployment stage disabled — no deployment target configured
  # deploy:
  #   name: "Deploy · Production"
  #   needs: build
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     # Compose pulls every value from this `env:` block. Anything
  #     # missing falls back to the defaults declared in
  #     # docker-compose.prod.yml; the REQUIRED ones (`${VAR:?...}`)
  #     # cause compose to abort if not set.
  #     - name: Deploy with compose
  #       env:
  #         # --- secrets ---
  #         DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  #         POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  #         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  #         # --- non-secret config ---
  #         ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
  #         CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
  #         BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE }}:${{ github.sha }}
  #         FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}:${{ github.sha }}
  #         REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
  #         APP_ENV: prod
  #         # --- optional tuning (CI value or compose default wins) ---
  #         GUNICORN_WORKERS: ${{ vars.GUNICORN_WORKERS }}
